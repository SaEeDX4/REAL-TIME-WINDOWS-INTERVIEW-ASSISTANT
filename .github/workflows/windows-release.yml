name: windows-release

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore InterviewAssistant.sln

      - name: Build
        run: dotnet build InterviewAssistant.sln -c Release --no-restore

      - name: Test (unit, engine, 60-min simulated soak, answer evaluation)
        run: dotnet test tests/InterviewAssistant.Tests -c Release --no-build --logger "console;verbosity=detailed"
        env:
          # Optional: add a repository secret named OPENAI_API_KEY to enable the live LLM evaluation test.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Publish + package
        shell: pwsh
        run: ./scripts/build-release.ps1 -SkipTests

      - name: Smoke test (launch the real EXE on Windows)
        shell: pwsh
        run: ./scripts/smoke-test.ps1

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: InterviewAssistant-win-x64
          path: artifacts/InterviewAssistant-win-x64.zip
          if-no-files-found: error

      - name: GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/InterviewAssistant-win-x64.zip
