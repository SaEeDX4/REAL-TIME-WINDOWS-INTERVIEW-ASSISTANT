name: windows-release

# Windows build + launch validation for every push/PR: unit tests, publish, real-EXE smoke + self-test,
# Velopack installer, and an N -> N+1 install/update test. Tagged releases are produced by production-release.yml.
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InterviewAssistant.sln

      - name: Build (warnings are errors)
        run: dotnet build InterviewAssistant.sln -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test (unit, engine, 60-min simulated soak, answer evaluation)
        run: dotnet test tests/InterviewAssistant.Tests -c Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
        env:
          # Optional: repository secret OPENAI_API_KEY enables the live LLM evaluation test.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Publish win-x64 self-contained + package
        shell: pwsh
        run: ./scripts/build-release.ps1 -SkipTests

      - name: Smoke test — launch real EXE, window appears, stays alive, clean exit
        shell: pwsh
        run: ./scripts/smoke-test.ps1

      - name: In-app self-test — XAML windows, manual UI, missing-key paths, DPAPI, settings
        shell: pwsh
        run: ./scripts/selftest.ps1

      - name: Installer (Velopack, unsigned CI build)
        shell: pwsh
        run: ./scripts/package-installer.ps1 -Version 2.0.0 -Channel stable

      - name: Install N, self-update to N+1, verify, uninstall
        shell: pwsh
        run: ./scripts/update-test.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: InterviewAssistant-Setup-unsigned
          path: artifacts/installer/
          if-no-files-found: error

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: InterviewAssistant-Windows-x64
          path: artifacts/InterviewAssistant-Windows-x64.zip
          if-no-files-found: error

      - name: Upload validation evidence (logs, self-test JSON, test results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            artifacts/selftest-result.json
            artifacts/test-results/
            artifacts/evidence/
          if-no-files-found: warn
