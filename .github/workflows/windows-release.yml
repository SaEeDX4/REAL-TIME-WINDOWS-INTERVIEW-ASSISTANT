name: windows-release

# Windows build + launch validation for every push/PR: unit tests, publish, real-EXE smoke + self-test,
# Velopack installer, and an N -> N+1 install/update test. Tagged releases are produced by production-release.yml.
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: "Version (single source: the app project)"
        id: v
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/InterviewAssistant.App/InterviewAssistant.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Not a semantic version: $v" }
          $sha = "${{ github.sha }}".Substring(0, 12)
          "version=$v" >> $env:GITHUB_OUTPUT
          "commit=$sha" >> $env:GITHUB_OUTPUT
          "channel=$(if ($v.Contains('-')) { 'beta' } else { 'stable' })" >> $env:GITHUB_OUTPUT
          Write-Host "Building $v ($sha)"

      - name: Restore
        run: dotnet restore InterviewAssistant.sln

      - name: Build (warnings are errors)
        run: dotnet build InterviewAssistant.sln -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test (unit, engine, 60-min simulated soak, answer evaluation)
        run: dotnet test tests/InterviewAssistant.Tests -c Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
        env:
          # Optional: repository secret OPENAI_API_KEY enables the live LLM evaluation test.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Publish win-x64 self-contained + package
        shell: pwsh
        run: ./scripts/build-release.ps1 -SkipTests -Version ${{ steps.v.outputs.version }} -Commit ${{ steps.v.outputs.commit }}

      - name: Smoke test — launch real EXE, window appears, stays alive, clean exit
        shell: pwsh
        run: ./scripts/smoke-test.ps1

      - name: In-app self-test — XAML windows, manual UI, missing-key paths, DPAPI, settings
        shell: pwsh
        run: ./scripts/selftest.ps1

      - name: Installer (Velopack, unsigned CI build)
        shell: pwsh
        run: ./scripts/package-installer.ps1 -Version ${{ steps.v.outputs.version }} -Channel ${{ steps.v.outputs.channel }} -ReleaseNotes docs/release/RELEASE_NOTES_${{ steps.v.outputs.version }}.md

      - name: Install N, self-update to N+1, verify, uninstall
        shell: pwsh
        run: ./scripts/update-test.ps1

      # Only reached when every step above passed: the artifacts come from this exact, validated commit.
      - name: Release-candidate package (portable ZIP, Setup.exe, SHA-256, notes, build info)
        shell: pwsh
        run: ./scripts/package-rc.ps1 -Version ${{ steps.v.outputs.version }} -Commit ${{ github.sha }} -RunUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: InterviewAssistant-v${{ steps.v.outputs.version }}
          path: artifacts/release/
          if-no-files-found: error

      - name: Upload validation evidence (logs, self-test JSON, test results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            artifacts/selftest-result.json
            artifacts/test-results/
            artifacts/evidence/
          if-no-files-found: warn
